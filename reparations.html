<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf8f3">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chez nous">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Chez nous</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap">
<style>
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Mise en page : une colonne claire. En tête, le virement du mois puis le détail du calcul ligne par ligne ; ensuite les postes à modifier.
   Choix assumé d'un seul thème clair : blanc cassé, vert sapin, touche de jaune moutarde. */
:root{
  --bg:#faf8f3; --card:#ffffff; --ink:#1b211e; --muted:#5f6862; --faint:#8a918c; --line:#e5e2d9;
  --green:#1f5e4a; --green-2:#2f7a61; --green-soft:#e8f0eb;
  --mustard:#d9a21b; --mustard-soft:#fbf1d4; --red:#b5432f;
  --shape1:#e9f1ea; --shape2:#f8eed3;
  --a:#1f5e4a; --b:#d9a21b;
  --font:"Newsreader",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;padding:max(32px, calc(env(safe-area-inset-top) + 16px)) max(16px, env(safe-area-inset-right)) max(72px, calc(env(safe-area-inset-bottom) + 40px)) max(16px, env(safe-area-inset-left));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg svg{width:100%;height:100%;display:block}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:38px;font-weight:500;letter-spacing:-.01em}
h1 .heart{color:var(--mustard);font-size:.75em;vertical-align:.1em}
h2{font-size:23px;font-weight:500}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px}
.sub{font-size:17px;font-style:italic;color:var(--muted);margin-top:4px}
.month{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}
.month span{font-weight:500;min-width:8.5em;text-align:center;text-transform:capitalize}
button{font:inherit;color:inherit;cursor:pointer}
.icon{border:0;background:transparent;border-radius:7px;width:32px;height:32px;display:grid;place-items:center;font-size:18px;color:var(--green)}
.icon:hover{background:var(--green-soft)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* carte du virement */
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hero-top{padding:24px 24px 20px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:16px;font-style:italic;color:var(--muted)}
.transfer{font-size:clamp(26px,5.6vw,34px);font-weight:500;line-height:1.2}
.transfer .amt{color:var(--green);font-weight:600;white-space:nowrap;background:linear-gradient(transparent 62%,var(--mustard-soft) 62%);padding:0 2px}
.transfer-note{font-size:16px;color:var(--muted);margin:-4px 0 0}
.toggle{align-self:flex-start;border:1px solid var(--green);background:var(--green);color:#fff;border-radius:8px;padding:8px 16px;font-weight:500;font-size:16px}
.toggle:hover{background:var(--green-2)}
.toggle[aria-pressed="true"]{background:var(--green-soft);color:var(--green)}

.calc{padding:20px 24px 24px;display:flex;flex-direction:column;gap:22px}
.calc h3{font-size:19px;font-weight:500;font-style:italic;color:var(--green);margin-bottom:6px}
.lines{display:flex;flex-direction:column}
.line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-variant-numeric:tabular-nums}
.line span:last-child{font-weight:500;white-space:nowrap}
.line .op{display:inline-block;width:1.2em;color:var(--faint);font-weight:700}
.line.total{border-top:1px solid var(--ink);margin-top:4px;padding-top:10px;font-weight:600}
.line.total span:last-child{font-weight:600}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.person .who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px;margin-bottom:4px}
.person .who i{width:10px;height:10px;border-radius:50%;flex:none}
.person .line{padding:3px 0;font-size:16px}
.person .line span:first-child{color:var(--muted)}
.person .res{margin-top:6px;padding-top:8px;border-top:1px solid var(--line);font-size:16px;font-weight:500;font-style:italic}
.person .res.plus{color:var(--green)} .person .res.minus{color:var(--red)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:3px;margin-top:4px}
.bar i{display:block;height:100%}
.bar i:first-child{border-radius:999px 0 0 999px}.bar i:last-child{border-radius:0 999px 999px 0}

/* sections */
section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;flex-wrap:wrap}
.sec-title{display:flex;align-items:baseline;gap:8px 10px;flex-wrap:wrap}
.total{font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}
.hint{font-size:16px;color:var(--muted);margin:-4px 0 0}
.rows{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 110px 220px 76px 34px;gap:8px;align-items:center;padding:5px 10px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row input,.row select{font:inherit;font-size:max(16px,1em);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.row input:hover,.row select:hover{border-color:var(--line)}
.row input:focus,.row select:focus{border-color:var(--green);outline:none;background:#fcfdfc}
.row .m{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.row .w{color:var(--muted)}
.kind{border:1px solid var(--line);background:var(--card);color:var(--green);border-radius:999px;padding:3px 10px;font-size:14px;font-style:italic;white-space:nowrap}
.kind:hover{border-color:var(--green)}
.kind.is-perso{color:var(--faint);border-style:dashed}
.row.perso .l,.row.perso .m{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}
.del{border:0;background:transparent;color:var(--faint);width:30px;height:30px;border-radius:7px;font-size:18px;line-height:1}
.del:hover{background:#f6e6e2;color:var(--red)}
.empty{padding:14px 12px;color:var(--muted);font-size:16px;font-style:italic}
.add{align-self:flex-start;border:1px dashed var(--green);background:transparent;color:var(--green);border-radius:8px;padding:5px 14px;font-size:16px;font-weight:500}
.add:hover{background:var(--green-soft);border-style:solid}
.names{display:flex;gap:10px 16px;flex-wrap:wrap}
.names label{display:flex;flex-direction:column;gap:6px;font-size:15px;font-style:italic;color:var(--muted);flex:1 1 200px}
.names input{font:inherit;font-style:normal;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.names input:focus{border-color:var(--green);outline:none}
.status{font-size:15px;font-style:italic;color:var(--muted);min-height:1.2em}
.notice{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.primary{background:var(--green);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700}
.tag{display:inline-block;font-size:15px;font-style:italic;color:var(--faint)}
.tag-mod{color:#9a6f05}
.tpl{display:flex;flex-wrap:wrap;gap:6px 18px}
.link{border:0;background:none;padding:2px 0;color:var(--green);font-size:16px;text-decoration:underline;text-underline-offset:4px}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled .add,fieldset:disabled .del{display:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10;width:100%;height:100%}
@media (max-width:560px){
  h1{font-size:28px}
  .hero-top,.calc{padding-left:18px;padding-right:18px}
  .row{grid-template-columns:minmax(0,1fr) 104px 30px;grid-template-areas:"l m d" "w k d"}
  .row .kind,.row .kind-gap{grid-area:k;justify-self:end}
  .row .l{grid-area:l}.row .m{grid-area:m}.row .w{grid-area:w}.row .del{grid-area:d}
  .row .w{font-size:16px}
}
@media (prefers-reduced-motion:no-preference){ .bar i{transition:width .4s ease} }
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;align-self:flex-start}
.tabs a{padding:6px 16px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:16px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--green);color:#fff}

/* ménage */
.groups{display:flex;flex-direction:column;gap:28px}
.group h2{margin-bottom:10px}
.group h2 small{font-size:16px;font-style:italic;color:var(--faint);font-weight:400;margin-left:6px}
.tasks{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.task .name{font-size:18px;font-weight:500}
.task .meta{font-size:15px;color:var(--muted);font-style:italic}
.task .meta .late{color:var(--red);font-style:normal;font-weight:500}
.task .meta .today{color:#9a6f05;font-style:normal;font-weight:500}
.done-btn{border:1px solid var(--green);background:var(--card);color:var(--green);border-radius:999px;padding:7px 16px;font-size:16px;white-space:nowrap}
.done-tag{color:var(--green);font-size:16px;font-style:italic;padding:7px 4px;white-space:nowrap}
.task.is-done .name{color:var(--muted)}
.done-btn:disabled{opacity:.6}
.done-btn:hover{background:var(--green);color:#fff}
.task.just .done-btn{background:var(--green-soft);border-color:var(--green-soft)}
.empty-good{padding:16px 14px;color:var(--muted);font-style:italic}
details.later summary{cursor:pointer;color:var(--green);font-size:17px;list-style:none;padding:4px 0}
details.later summary::-webkit-details-marker{display:none}
details.later[open] summary{margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:max(20px, calc(env(safe-area-inset-bottom) + 12px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:12px;font-size:16px;box-shadow:0 8px 24px -10px rgba(0,0,0,.4);z-index:5;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--mustard);font:inherit;text-decoration:underline;padding:2px 6px}
.edit-row{display:grid;grid-template-columns:minmax(0,1fr) 150px 170px 34px;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--line)}
.edit-row:first-child{border-top:0}
.edit-row input,.edit-row select{font:inherit;font-size:max(16px,1em);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.edit-row input:hover,.edit-row select:hover{border-color:var(--line)}
.edit-row input:focus,.edit-row select:focus{border-color:var(--green);outline:none}
.edit-row .freq{display:flex;align-items:center;gap:4px;color:var(--muted)}
.edit-row .freq input{width:60px;text-align:right}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
@media (max-width:560px){
  .edit-row{grid-template-columns:minmax(0,1fr) 30px;grid-template-areas:"n d" "f d" "p d"}
  .edit-row .n{grid-area:n}.edit-row .freq{grid-area:f}.edit-row .p{grid-area:p}.edit-row .del{grid-area:d}
  .task{padding:12px}
  .task .name{font-size:17px}
}
.who-a{color:var(--green)} .who-b{color:#9a6f05}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.score div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column}
.score span{font-weight:500}
.score b{font-size:30px;font-weight:500;line-height:1.1;color:var(--ink)}
.score small{color:var(--muted);font-style:italic;font-size:15px}
.score .who-a{border-top:3px solid var(--green)} .score .who-b{border-top:3px solid var(--mustard)}
.hrow{display:flex;align-items:baseline;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:16px}
.hrow:first-child{border-top:0}
.hrow span{flex:1;min-width:0}
.hrow b{font-weight:600}
.hrow small{color:var(--faint);font-style:italic;white-space:nowrap}
.hrow i{width:9px;height:9px;border-radius:50%;flex:none;align-self:center;background:var(--line)}
.hrow .dot-a{background:var(--green)} .hrow .dot-b{background:var(--mustard)}
.freq .every,.freq .after{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.freq .after select{max-width:200px}
.freq .after,.freq .days{order:2}
.edit-row .freq select{width:auto}
.edit-row .freq{display:flex;align-items:center;gap:6px}
.days{display:inline-flex;gap:3px;flex-wrap:wrap}
.day{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:14px;padding:0}
.day.on{background:var(--green);border-color:var(--green);color:#fff}
.edit-row{grid-template-columns:minmax(0,1fr) auto 34px !important}
.edit-row .freq{flex-wrap:wrap}
.idees{display:flex;flex-wrap:wrap;gap:8px}
.idees p{flex-basis:100%}
.chip{border:1px dashed var(--green);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:15px}
.chip small{color:var(--faint);font-style:italic}
.chip:hover{border-style:solid}
@media (max-width:560px){ .edit-row{grid-template-columns:minmax(0,1fr) 30px !important;grid-template-areas:"n d" "f d" !important} }

/* liste du jour, version légère */
.today-block{display:flex;flex-direction:column;gap:10px}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.day-head h2{font-size:30px}
.day-head .date{color:var(--muted);font-style:italic}
.progress{height:4px;background:var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .4s ease}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .txt{display:flex;flex-direction:column;min-width:0}
.item .name{font-size:19px;line-height:1.25}
.item .meta{font-size:15px;color:var(--muted);font-style:italic}
.item .late{color:var(--red);font-style:normal}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--green);background:transparent;display:grid;place-items:center;padding:0;cursor:pointer}
.check svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check:hover{background:var(--green-soft)}
.check.on{background:var(--green)}
.check.on svg{opacity:1}
.item.fait .name{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}
.done-list{margin-top:-2px}
.list.small .name{font-size:17px}
.list.small .check{width:26px;height:26px}
.calm{margin:0;color:var(--muted);font-style:italic;font-size:18px}
.next-block h3{font-size:19px;font-weight:500;font-style:italic;color:var(--green);margin:0 0 6px}
.next-day{display:grid;grid-template-columns:7.5em 1fr;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:16px}
.next-day:last-child{border-bottom:0}
.next-day .dn{color:var(--muted)}
.bloc{border-top:1px solid var(--line);padding-top:12px}
.bloc summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;font-size:18px}
.bloc summary::-webkit-details-marker{display:none}
.bloc summary::after{content:'›';color:var(--faint);transition:transform .2s}
.bloc[open] summary::after{transform:rotate(90deg)}
.bloc summary>span:first-child{white-space:nowrap}
.bloc summary .tally{margin-left:auto;color:var(--muted);font-size:16px;text-align:right}
.bloc[open] summary{margin-bottom:8px}
.hlist{list-style:none;margin:0;padding:0}
.hlist li{display:flex;gap:8px;padding:6px 0;font-size:16px;border-bottom:1px solid var(--line)}
.hlist li:last-child{border-bottom:0}
.hlist small{margin-left:auto;color:var(--faint);font-style:italic;white-space:nowrap}
.foot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;border-top:1px solid var(--line);padding-top:14px}
#app{display:flex;flex-direction:column;gap:28px}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}


/* à réparer */
.add-form{display:flex;flex-wrap:wrap;gap:8px}
.add-form input{flex:1 1 220px;min-width:0;font:inherit;font-size:max(17px,1em);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.add-form select{font:inherit;font-size:max(16px,1em);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.add-form input:focus,.add-form select:focus{outline:none;border-color:var(--green)}
.add-form button{border:0;background:var(--green);color:#fff;border-radius:10px;padding:0 18px;font:inherit;font-size:17px;min-height:46px}
.groupe h3{font-size:16px;font-weight:500;font-style:italic;color:var(--green);margin:0 0 2px}
.groupe.urgent h3{color:var(--red)}
.r-list{list-style:none;margin:0;padding:0}
.r-item{display:flex;align-items:flex-start;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.r-item:last-child{border-bottom:0}
.r-item .check{margin-top:2px}
.r-item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.r-item .name{font-size:19px;line-height:1.25}
.r-item .meta{font-size:14px;color:var(--faint);font-style:italic}
.r-item .meta .vieux{color:#9a6f05;font-style:normal}
.r-item textarea{font:inherit;font-size:max(16px,.95em);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 6px;margin-left:-6px;resize:none;width:100%;min-height:1.6em}
.r-item textarea:hover{border-color:var(--line)}
.r-item textarea:focus{outline:none;border-color:var(--green);background:var(--card)}
.r-item textarea::placeholder{color:var(--faint);font-style:italic}
.r-item.fait .name{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}
.r-actions{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.urg{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:3px 10px;font:inherit;font-size:14px;white-space:nowrap}
.urg.u-urgent{border-color:var(--red);color:var(--red)}
.r-item .x{border:0;background:transparent;color:var(--faint);font-size:20px;width:32px;height:32px;border-radius:50%}
.r-item .x:hover{color:var(--red);background:#f6e6e2}
#app{display:flex;flex-direction:column;gap:26px}
.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap}
@media (max-width:420px){.tabs a{padding:6px 11px;font-size:15px}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true">
<svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <path d="M-80 -60 C 120 -70 290 10 280 150 C 270 260 150 300 70 340 C 0 380 -80 350 -100 270 Z" fill="var(--shape1)"/>
  <circle cx="1110" cy="120" r="130" fill="var(--shape2)"/>
  <path d="M1280 640 C 1170 610 1040 650 1010 750 C 980 850 1070 940 1180 955 C 1260 965 1300 890 1295 800 Z" fill="var(--shape1)"/>
</svg>
</div>
<div class="wrap">
  <nav class="tabs" aria-label="Sections"><a href="./">Budget</a><a href="menage.html">Ménage</a><a href="courses.html">Courses</a><a href="reparations.html" aria-current="page">À réparer</a></nav>
  <header>
    <div>
      <h1>À réparer</h1>
      <div class="sub">Les petits travaux qui traînent, pour ne plus les oublier</div>
    </div>
  </header>
  <div id="app"><div class="notice"><p class="muted" style="margin:0">Chargement</p></div></div>
  <div class="status" id="status" aria-live="polite"></div>
  <button class="link" id="logout" hidden style="align-self:flex-start">Se déconnecter</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>firebase.initializeApp(window.FIREBASE_CONFIG);</script>
<script src="sauvegarde.js"></script>
<script>
(async function(){
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flash = m => { $('#status').textContent = m; };
const URGENCES = [['urgent','Urgent'],['bientot','Bientôt'],['unjour','Un jour']];
const libUrg = u => (URGENCES.find(x => x[0] === u) || URGENCES[1])[1];

const auth = firebase.auth(), fs = firebase.firestore();
try { await fs.enablePersistence({synchronizeTabs:true}); } catch(e) {}
auth.getRedirectResult().catch(()=>{});
const col = fs.collection('reparations');

let items = [], loaded = false, moi = null;
let personnes = {a:'Personne A', b:'Personne B'};

function depuis(ms){
  if(!ms) return '';
  const j = Math.floor((Date.now() - ms)/86400000);
  if(j < 1) return 'aujourd’hui';
  if(j === 1) return 'hier';
  if(j < 14) return `il y a ${j} jours`;
  if(j < 60) return `il y a ${Math.round(j/7)} semaines`;
  return `il y a ${Math.round(j/30)} mois`;
}
const ms = t => t && t.toMillis ? t.toMillis() : (typeof t === 'number' ? t : 0);
const nom = x => personnes[x] || '';

function ligne(x){
  const vieux = !x.fait && Date.now() - ms(x.ts) > 30*86400000;
  const meta = x.fait
    ? `réglé ${depuis(ms(x.faitLe))}${x.faitPar ? ' par <b class="who-' + x.faitPar + '">' + esc(nom(x.faitPar)) + '</b>' : ''}`
    : `noté ${vieux ? '<span class="vieux">' + depuis(ms(x.ts)) + '</span>' : depuis(ms(x.ts))}${x.cle ? ' par ' + esc(nom(x.cle)) : ''}`;
  return `<li class="r-item${x.fait?' fait':''}" data-id="${x.id}">
    <button class="check${x.fait?' on':''}" data-fait="${x.id}" aria-pressed="${x.fait?'true':'false'}" aria-label="${x.fait?'Remettre à faire':'C’est réglé'} : ${esc(x.titre)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9"/></svg></button>
    <div class="txt">
      <span class="name">${esc(x.titre)}</span>
      ${x.fait ? (x.note ? `<span class="meta">${esc(x.note)}</span>` : '') : `<textarea rows="1" data-note="${x.id}" placeholder="Une précision ? (quoi acheter, qui appeler…)" aria-label="Précision">${esc(x.note||'')}</textarea>`}
      <span class="meta">${meta}</span>
    </div>
    <div class="r-actions">
      ${x.fait ? '' : `<button class="urg u-${x.urgence||'bientot'}" data-urg="${x.id}" title="Changer l’urgence">${libUrg(x.urgence)}</button>`}
      <button class="x" data-suppr="${x.id}" aria-label="Supprimer ${esc(x.titre)}">×</button>
    </div>
  </li>`;
}

function render(){
  if(!loaded || !moi) return;
  const ouverts = items.filter(x => !x.fait), faits = items.filter(x => x.fait).sort((a,b)=>ms(b.faitLe)-ms(a.faitLe));
  const groupes = URGENCES.map(([u, lib]) => [u, lib, ouverts.filter(x => (x.urgence||'bientot') === u).sort((a,b)=>ms(a.ts)-ms(b.ts))]).filter(g => g[2].length);
  app.innerHTML = `
    <form class="add-form" id="ajout" autocomplete="off">
      <input id="titre" placeholder="Ex. ampoule de la salle de bain grillée" aria-label="Ce qu’il faut réparer" enterkeyhint="done">
      <select id="urgence" aria-label="Urgence">${URGENCES.map(([u,l])=>`<option value="${u}"${u==='bientot'?' selected':''}>${l}</option>`).join('')}</select>
      <button type="submit">Ajouter</button>
    </form>
    ${groupes.length ? groupes.map(([u, lib, l]) => `<section class="groupe ${u}"><h3>${lib}</h3><ul class="r-list">${l.map(ligne).join('')}</ul></section>`).join('')
      : '<p class="calm">Rien à réparer pour l’instant.</p>'}
    ${faits.length ? `<details class="bloc"><summary><span>Réglé</span><span class="tally">${faits.length}</span></summary><ul class="r-list">${faits.slice(0,30).map(ligne).join('')}</ul></details>` : ''}
    <div class="foot"><span class="hint">Connecté en tant que <b class="who-${moi.cle}">${esc(moi.nom)}</b></span></div>`;
  $('#ajout').onsubmit = async e => {
    e.preventDefault();
    const t = $('#titre').value.trim(); if(!t) return;
    const urg = $('#urgence').value;
    $('#titre').value = '';
    await col.add({titre: t.charAt(0).toUpperCase() + t.slice(1), note:'', urgence: urg, fait:false, cle: moi.cle, ts: firebase.firestore.FieldValue.serverTimestamp()});
  };
  app.querySelectorAll('textarea').forEach(a => { a.style.height = 'auto'; a.style.height = a.scrollHeight + 'px'; });
}

const timers = {};
app.addEventListener('input', e => {
  const a = e.target.closest('[data-note]'); if(!a) return;
  a.style.height = 'auto'; a.style.height = a.scrollHeight + 'px';
  clearTimeout(timers[a.dataset.note]);
  timers[a.dataset.note] = setTimeout(() => col.doc(a.dataset.note).update({note: a.value.trim()}).then(()=>flash('Enregistré')).catch(()=>flash("L'enregistrement a échoué.")), 600);
});
app.addEventListener('click', async e => {
  const f = e.target.closest('[data-fait]');
  if(f){
    const x = items.find(i => i.id === f.dataset.fait); if(!x) return;
    await col.doc(x.id).update(x.fait ? {fait:false, faitPar:null, faitLe:null} : {fait:true, faitPar: moi.cle, faitLe: firebase.firestore.FieldValue.serverTimestamp()});
    return;
  }
  const u = e.target.closest('[data-urg]');
  if(u){
    const x = items.find(i => i.id === u.dataset.urg); if(!x) return;
    const ordre = URGENCES.map(z => z[0]); const suiv = ordre[(ordre.indexOf(x.urgence||'bientot') + 1) % ordre.length];
    await col.doc(x.id).update({urgence: suiv}); return;
  }
  const s = e.target.closest('[data-suppr]');
  if(s){
    if(s.dataset.confirm){ await col.doc(s.dataset.suppr).delete(); return; }
    s.dataset.confirm = '1'; s.textContent = 'Sûr ?'; s.style.width = 'auto'; s.style.fontSize = '14px'; s.style.color = 'var(--red)';
    setTimeout(()=>{ if(document.body.contains(s)){ delete s.dataset.confirm; s.textContent='×'; s.style.width=''; s.style.fontSize=''; s.style.color=''; } }, 3000);
  }
});

function loginBox(){
  app.innerHTML = `<div class="notice"><h2>Connexion</h2>
    <p class="muted" style="margin:0">Connecte toi avec ton compte Google.</p>
    <button class="primary" id="login">Se connecter avec Google</button></div>`;
  $('#login').onclick = () => {
    const p = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(p).catch(err => {
      if(err && (err.code==='auth/popup-blocked' || err.code==='auth/operation-not-supported-in-this-environment')) return auth.signInWithRedirect(p);
      if(err && err.code==='auth/popup-closed-by-user') return;
      flash("La connexion n'a pas marché, réessaie.");
    });
  };
}
function refuse(){
  app.innerHTML = `<div class="notice"><h2>Accès refusé</h2><p class="muted" style="margin:0">Ce compte Google n'a pas accès. Connecte toi avec le bon compte.</p><button class="primary" id="out2">Changer de compte</button></div>`;
  $('#out2').onclick = () => auth.signOut().then(()=>location.reload());
}
function choisirNom(u){
  app.innerHTML = `<div class="notice"><h2>Qui es-tu ?</h2>
    <p class="muted" style="margin:0">Pour savoir qui a noté quoi. Je ne te le demanderai qu’une fois.</p>
    <div class="toolbar"><button class="primary" data-cle="a">${esc(personnes.a)}</button><button class="primary" data-cle="b">${esc(personnes.b)}</button></div></div>`;
  app.querySelectorAll('[data-cle]').forEach(b => b.onclick = async () => {
    const cle = b.dataset.cle; moi = {uid:u.uid, cle, nom:personnes[cle]};
    await fs.collection('membres').doc(u.uid).set({cle}); render();
  });
}

let started = false;
auth.onAuthStateChanged(async u => {
  if(!u){ loginBox(); $('#logout').hidden = true; return; }
  $('#logout').hidden = false;
  if(started) return; started = true;
  try{
    const b = await fs.doc('budget/main').get();
    if(b.exists && b.data().personnes) personnes = {...personnes, ...b.data().personnes};
    const m = await fs.collection('membres').doc(u.uid).get();
    if(m.exists) moi = {uid:u.uid, cle:m.data().cle, nom:personnes[m.data().cle]};
  }catch(e){ return refuse(); }
  if(!moi) choisirNom(u);
  setTimeout(() => window.Sauvegarde && Sauvegarde.auto(fs), 3000);
  col.onSnapshot(snap => {
    items = snap.docs.map(d => ({id:d.id, ...d.data()}));
    loaded = true;
    const a = document.activeElement;
    if(a && (a.id === 'titre' || a.matches('textarea'))) { // on ne coupe pas une saisie en cours
      const v = a.id === 'titre' ? a.value : null;
      if(a.matches('textarea')) return;
      render(); $('#titre').value = v; $('#titre').focus(); return;
    }
    render();
  }, refuse);
});
app.addEventListener('focusout', e => { if(e.target.matches('textarea')) setTimeout(() => { if(!document.activeElement.matches('textarea')) render(); }, 700); });
$('#logout').onclick = () => auth.signOut().then(()=>location.reload());
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  let recharge = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recharge) { recharge = true; location.reload(); } });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => {
    r.update().catch(()=>{});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) r.update().catch(()=>{}); });
  }).catch(()=>{}));
}
</script>
</body>
</html>
