name: Rappel du ménage

on:
  schedule:
    # À midi et à 18h, heure de Paris. Deux lancements par rappel (heure d'été, heure d'hiver),
    # le script garde le bon, attend l'heure pile et n'envoie qu'une fois par créneau.
    - cron: '40 9 * * *'
    - cron: '40 10 * * *'
    - cron: '40 15 * * *'
    - cron: '40 16 * * *'
  workflow_dispatch:

jobs:
  rappel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rappel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --silent
      - run: node rappel.mjs
        env:
          TZ: Europe/Paris
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
