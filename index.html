<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf8f3">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chez nous">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Chez nous</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap">
<style>
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Mise en page : une colonne claire. En tête, le virement du mois puis le détail du calcul ligne par ligne ; ensuite les postes à modifier.
   Choix assumé d'un seul thème clair : blanc cassé, vert sapin, touche de jaune moutarde. */
:root{
  --bg:#faf8f3; --card:#ffffff; --ink:#1b211e; --muted:#5f6862; --faint:#8a918c; --line:#e5e2d9;
  --green:#1f5e4a; --green-2:#2f7a61; --green-soft:#e8f0eb;
  --mustard:#d9a21b; --mustard-soft:#fbf1d4; --red:#b5432f;
  --shape1:#e9f1ea; --shape2:#f8eed3;
  --a:#1f5e4a; --b:#d9a21b;
  --font:"Newsreader",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;padding:max(32px, calc(env(safe-area-inset-top) + 16px)) max(16px, env(safe-area-inset-right)) max(72px, calc(env(safe-area-inset-bottom) + 40px)) max(16px, env(safe-area-inset-left));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg svg{width:100%;height:100%;display:block}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:38px;font-weight:500;letter-spacing:-.01em}
h1 .heart{color:var(--mustard);font-size:.75em;vertical-align:.1em}
h2{font-size:23px;font-weight:500}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px}
.sub{font-size:17px;font-style:italic;color:var(--muted);margin-top:4px}
.month{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}
.month span{font-weight:500;min-width:8.5em;text-align:center;text-transform:capitalize}
button{font:inherit;color:inherit;cursor:pointer}
.icon{border:0;background:transparent;border-radius:7px;width:32px;height:32px;display:grid;place-items:center;font-size:18px;color:var(--green)}
.icon:hover{background:var(--green-soft)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* carte du virement */
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hero-top{padding:24px 24px 20px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:16px;font-style:italic;color:var(--muted)}
.transfer{font-size:clamp(26px,5.6vw,34px);font-weight:500;line-height:1.2}
.transfer .amt{color:var(--green);font-weight:600;white-space:nowrap;background:linear-gradient(transparent 62%,var(--mustard-soft) 62%);padding:0 2px}
.transfer-note{font-size:16px;color:var(--muted);margin:-4px 0 0}
.toggle{align-self:flex-start;border:1px solid var(--green);background:var(--green);color:#fff;border-radius:8px;padding:8px 16px;font-weight:500;font-size:16px}
.toggle:hover{background:var(--green-2)}
.toggle[aria-pressed="true"]{background:var(--green-soft);color:var(--green)}

.calc{padding:20px 24px 24px;display:flex;flex-direction:column;gap:22px}
.calc h3{font-size:19px;font-weight:500;font-style:italic;color:var(--green);margin-bottom:6px}
.lines{display:flex;flex-direction:column}
.line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-variant-numeric:tabular-nums}
.line span:last-child{font-weight:500;white-space:nowrap}
.line .op{display:inline-block;width:1.2em;color:var(--faint);font-weight:700}
.encours{border-top:1px solid var(--line);padding-top:16px}
@media (max-width:560px){ .calc .line{flex-wrap:wrap;gap:0 12px} .calc .line span:last-child{margin-left:auto;text-align:right} }
.line.total{border-top:1px solid var(--ink);margin-top:4px;padding-top:10px;font-weight:600}
.line.total span:last-child{font-weight:600}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.person .who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px;margin-bottom:4px}
.person .who i{width:10px;height:10px;border-radius:50%;flex:none}
.person .line{padding:3px 0;font-size:16px}
.person .line span:first-child{color:var(--muted)}
.person .res{margin-top:6px;padding-top:8px;border-top:1px solid var(--line);font-size:16px;font-weight:500;font-style:italic}
.person .res.plus{color:var(--green)} .person .res.minus{color:var(--red)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:3px;margin-top:4px}
.bar i{display:block;height:100%}
.bar i:first-child{border-radius:999px 0 0 999px}.bar i:last-child{border-radius:0 999px 999px 0}

/* sections */
section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;flex-wrap:wrap}
.sec-title{display:flex;align-items:baseline;gap:8px 10px;flex-wrap:wrap}
.total{font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}
.hint{font-size:16px;color:var(--muted);margin:-4px 0 0}
.rows{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 110px 220px 76px 34px;gap:8px;align-items:center;padding:5px 10px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row input,.row select{font:inherit;font-size:max(16px,1em);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.row input:hover,.row select:hover{border-color:var(--line)}
.row input:focus,.row select:focus{border-color:var(--green);outline:none;background:#fcfdfc}
.row .m{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.row .w{color:var(--muted)}
.kind{border:1px solid var(--line);background:var(--card);color:var(--green);border-radius:999px;padding:3px 10px;font-size:14px;font-style:italic;white-space:nowrap}
.kind:hover{border-color:var(--green)}
.kind.is-perso{color:var(--faint);border-style:dashed}
.row.perso .l,.row.perso .m{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}
.del{border:0;background:transparent;color:var(--faint);width:30px;height:30px;border-radius:7px;font-size:18px;line-height:1}
.del:hover{background:#f6e6e2;color:var(--red)}
.empty{padding:14px 12px;color:var(--muted);font-size:16px;font-style:italic}
.add{align-self:flex-start;border:1px dashed var(--green);background:transparent;color:var(--green);border-radius:8px;padding:5px 14px;font-size:16px;font-weight:500}
.add:hover{background:var(--green-soft);border-style:solid}
.names{display:flex;gap:10px 16px;flex-wrap:wrap}
.names label{display:flex;flex-direction:column;gap:6px;font-size:15px;font-style:italic;color:var(--muted);flex:1 1 200px}
.names input{font:inherit;font-style:normal;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.names input:focus{border-color:var(--green);outline:none}
.status{font-size:15px;font-style:italic;color:var(--muted);min-height:1.2em}
.notice{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.primary{background:var(--green);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700}
.tag{display:inline-block;font-size:15px;font-style:italic;color:var(--faint)}
.tag-mod{color:#9a6f05}
.tpl{display:flex;flex-wrap:wrap;gap:6px 18px}
.link{border:0;background:none;padding:2px 0;color:var(--green);font-size:16px;text-decoration:underline;text-underline-offset:4px}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled .add,fieldset:disabled .del{display:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10;width:100%;height:100%}
@media (max-width:560px){
  h1{font-size:28px}
  .hero-top,.calc{padding-left:18px;padding-right:18px}
  .row{grid-template-columns:minmax(0,1fr) 104px 30px;grid-template-areas:"l m d" "w k d"}
  .row .kind,.row .kind-gap{grid-area:k;justify-self:end}
  .row .l{grid-area:l}.row .m{grid-area:m}.row .w{grid-area:w}.row .del{grid-area:d}
  .row .w{font-size:16px}
}
@media (prefers-reduced-motion:no-preference){ .bar i{transition:width .4s ease} }
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;align-self:flex-start}
.tabs a{padding:6px 16px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:16px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--green);color:#fff}
.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap}
@media (max-width:420px){.tabs a{padding:6px 11px;font-size:15px}}

/* suivi */
.suivi{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.legende{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;color:var(--muted)}
.legende i,.tip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px 4px}
.chart svg{display:block;width:100%;height:auto;max-width:100%}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:12px;font-family:var(--font)}
.chart .ax.now{fill:var(--ink)}
.chart .hit{cursor:pointer;outline:none}
.chart .hit.on,.chart .hit:focus-visible{fill:rgba(31,94,74,.06)}
.tip{position:absolute;top:0;z-index:2;background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;font-size:14px;min-width:200px;pointer-events:none;box-shadow:0 8px 20px -10px rgba(0,0,0,.4)}
.tip b{display:block;margin-bottom:4px;text-transform:capitalize}
.tip div{display:flex;align-items:center;gap:0;justify-content:flex-start}
.tip div span{margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums}
.tip .t{border-top:1px solid rgba(255,255,255,.25);margin-top:4px;padding-top:4px;font-weight:600}
.tab-wrap{overflow-x:auto}
.tab-wrap table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tab-wrap th,.tab-wrap td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tab-wrap th:first-child,.tab-wrap td:first-child{text-align:left;text-transform:capitalize}
.tab-wrap th{font-weight:500;color:var(--muted)}
.bloc{border-top:1px solid var(--line);padding-top:12px}
.bloc summary{display:flex;justify-content:space-between;cursor:pointer;list-style:none;font-size:17px;color:var(--green)}
.bloc summary::-webkit-details-marker{display:none}
.bloc[open] summary{margin-bottom:8px}
</style>
</head>
<body>

<div id="bg" aria-hidden="true">
<svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <path d="M-80 -60 C 120 -70 290 10 280 150 C 270 260 150 300 70 340 C 0 380 -80 350 -100 270 Z" fill="var(--shape1)"/>
  <circle cx="1110" cy="120" r="130" fill="var(--shape2)"/>
  <path d="M1280 640 C 1170 610 1040 650 1010 750 C 980 850 1070 940 1180 955 C 1260 965 1300 890 1295 800 Z" fill="var(--shape1)"/>
</svg>
</div>
<div class="wrap">
  <nav class="tabs" aria-label="Sections"><a href="./" aria-current="page">Budget</a><a href="menage.html">Ménage</a><a href="courses.html">Courses</a><a href="reparations.html">À réparer</a></nav>
  <header>
    <div>
      <h1>Le budget</h1>
      <div class="sub">Les comptes de la maison, partagés selon ce que chacun gagne</div>
    </div>
    <div class="month" aria-label="Mois affiché">
      <button class="icon" id="prev" aria-label="Mois précédent">‹</button>
      <span id="monthLabel"></span>
      <button class="icon" id="next" aria-label="Mois suivant">›</button>
    </div>
  </header>

  <div id="app">
    <div class="notice"><p class="muted" style="margin:0">Chargement du budget</p></div>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <button class="link" id="logout" hidden style="align-self:flex-start">Se déconnecter</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>firebase.initializeApp(window.FIREBASE_CONFIG);</script>
<script>
(function(){
const $ = s => document.querySelector(s);
const app = $('#app'), statusEl = $('#status');
const eur = n => (Math.round(n*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const pct = n => (n*100).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})+' %';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isFinite(n)?n:0; };
const uid = () => Math.random().toString(36).slice(2,9);
const sum = (arr, f) => (arr||[]).reduce((s,x)=> s + (f? (f(x)?num(x.montant):0) : num(x.montant)), 0);

let db = null, canWrite = true;
let main = null, mainExists = null;
let month = {depenses:[], vire:false};
let prev = {depenses:[], vire:false};   // le mois d'avant, pour régler ses dépenses
let cur = new Date(); cur = new Date(cur.getFullYear(), cur.getMonth(), 1);
let unsubMonth = null, unsubPrev = null, pendingRemoteMain = null, pendingRemoteMonth = null;
const timers = {};

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function setMonthLabel(){ $('#monthLabel').textContent = cur.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}); }
setMonthLabel();

const FIXED = ['charges','aides','revenus'];
const commun = list => (list||[]).filter(x=>!x.perso);
// Budget vide de départ (les vrais montants sont uniquement dans Firebase)
const DEPART = {personnes:{a:'Personne A',b:'Personne B'}, revenus:[], aides:[], charges:[]};
const clone = x => JSON.parse(JSON.stringify(x||[]));
function eff(coll){ return Array.isArray(month[coll]) ? month[coll] : (main?.[coll]||[]); }
function own(coll){ return Array.isArray(month[coll]); }
function ensureOwn(coll){ if(!own(coll)) month[coll] = clone(main[coll]); }
function differs(coll){ return own(coll) && JSON.stringify(month[coll]) !== JSON.stringify(main[coll]||[]); }
function names(){ return {a: main?.personnes?.a || 'Personne A', b: main?.personnes?.b || 'Personne B'}; }

/* ---------- calcul ---------- */
// Le virement de début de mois règle deux choses :
// les charges fixes du mois qui commence, et les dépenses du mois précédent (courses, sorties…).
function prorata(R){
  const Ra = sum(R, x=>x.qui==='a'), Rb = sum(R, x=>x.qui==='b');
  const pa = (Ra+Rb)>0 ? Ra/(Ra+Rb) : .5;
  return {Ra, Rb, pa, pb: 1-pa};
}
function soldeDepenses(m, R){
  const D = commun(m.depenses), p = prorata(R);
  const total = sum(D), paidA = sum(D,x=>x.payeur==='a'), paidB = sum(D,x=>x.payeur==='b');
  return {total, paidA, paidB, partA: total*p.pa, partB: total*p.pb, diff: paidA - total*p.pa};
}
function compute(){
  const N = names();
  const R = eff('revenus'), C = commun(eff('charges')), A = eff('aides');
  const {Ra, Rb, pa, pb} = prorata(R);
  const fixe = sum(C), aides = sum(A);
  const total = fixe - aides;
  const partA = total*pa, partB = total*pb;
  const paidA = sum(C,x=>x.compte==='a') - sum(A,x=>x.compte==='a');
  const paidB = sum(C,x=>x.compte==='b') - sum(A,x=>x.compte==='b');
  const diffFixe = paidA - partA;                      // >0 : B doit à A
  const Rprev = Array.isArray(prev.revenus) ? prev.revenus : (main?.revenus||[]);
  const avant = soldeDepenses(prev, Rprev);             // dépenses du mois précédent, réglées maintenant
  const enCours = soldeDepenses(month, R);              // dépenses de ce mois, réglées le mois prochain
  const diff = diffFixe + avant.diff;
  return {N,Ra,Rb,pa,pb,fixe,aides,total,partA,partB,paidA,paidB,diffFixe,avant,enCours,diff,communs:enCours.total};
}

/* ---------- rendu ---------- */
function whoSelect(field, val, N){
  return `<select class="w" data-f="${field}" aria-label="Compte">
    <option value="a"${val==='a'?' selected':''}>${field==='qui'?'':field==='payeur'?'Payé par ':''}${esc(N.a)}</option>
    <option value="b"${val==='b'?' selected':''}>${field==='qui'?'':field==='payeur'?'Payé par ':''}${esc(N.b)}</option></select>`;
}
const fmtIn = v => (v===''||v==null) ? '' : num(v).toFixed(2).replace('.',',');
function rowsHtml(list, coll, field, N, placeholder){
  if(!list || !list.length) return `<div class="empty">Rien pour l'instant.</div>`;
  return list.map(x=>`<div class="row${x.perso?' perso':''}" data-c="${coll}" data-id="${esc(x.id)}">
    <input class="l" data-f="label" value="${esc(x.label)}" placeholder="${placeholder}" aria-label="Libellé">
    <input class="m" data-f="montant" inputmode="decimal" value="${esc(fmtIn(x.montant))}" placeholder="0,00" aria-label="Montant en euros">
    ${whoSelect(field, x[field], N)}
    ${(coll==='charges'||coll==='depenses') ? `<button class="kind${x.perso?' is-perso':''}" data-perso aria-pressed="${x.perso?'true':'false'}" title="Une dépense perso n'entre pas dans le calcul">${x.perso?'perso':'commun'}</button>` : '<span class="kind-gap"></span>'}
    <button class="del" data-del aria-label="Supprimer ${esc(x.label)}">×</button></div>`).join('');
}

const SEC = {depenses:['--apricot'], charges:['--rose'], aides:['--lilac'], revenus:['--apricot'], noms:['--rose']};
function head(key,title,extra,tid){
  return `<div class="sec-head"><div class="sec-title"><h2>${title}</h2>${extra||''}</div>${tid?`<span class="total num" id="${tid}"></span>`:''}</div>`;
}
const secStyle = key => `style="--c:var(${SEC[key][0]})"`;
function fixedSection(coll,title,hint,field,N,ph,tid,addLabel){
  const d = differs(coll);
  const tag = d ? '<span class="tag tag-mod">changé ce mois-ci</span>' : '<span class="tag">comme d\'habitude</span>';
  const actions = d ? `<div class="tpl">
      <button class="link" data-tpl="${coll}">Garder pour les prochains mois</button>
      <button class="link" data-revert="${coll}">Remettre comme d'habitude</button></div>` : '';
  return `<section ${secStyle(coll)}>
    ${head(coll,title,tag,tid)}
    <p class="hint">${hint}</p>
    <div class="rows">${rowsHtml(eff(coll),coll,field,N,ph)}</div>
    <button class="add" data-add="${coll}">${addLabel}</button>${actions}
  </section>`;
}
function renderAll(){
  if(mainExists===false){
    app.innerHTML = `<div class="notice"><h2>Le budget n'est pas encore rempli</h2>
      <p class="muted" style="margin:0">Ajoute vos revenus, aides et charges fixes pour calculer automatiquement le virement du mois.</p>
      ${canWrite?'<button class="primary" id="init">Commencer un budget</button>':''}</div>`;
    const b = $('#init'); if(b) b.onclick = ()=>{ main = JSON.parse(JSON.stringify(DEPART)); mainExists=true; saveMain(true); renderAll(); };
    return;
  }
  if(!main) return;
  const N = names();
  app.innerHTML = `
  <div class="hero" id="hero"></div>
  <section class="suivi" id="suivi"></section>
  <fieldset id="edit" ${canWrite?'':'disabled'} style="display:flex;flex-direction:column;gap:28px;margin-top:28px">
    <section ${secStyle('depenses')}>
      ${head('depenses','Dépenses du mois','','t-dep')}

  const de = m => (/^[aeiouyh]/i.test(m) ? 'd’' : 'de ') + m;

      <button class="toggle" id="vire" aria-pressed="${month.vire?'true':'false'}" ${canWrite?'':'disabled'}>${month.vire?'Virement fait':'J\'ai fait le virement'}</button>

      <div>

        </div>
      </div>
      <div>
        <h3>Les charges ${de(ce)}</h3>
        <div class="lines num">
          ${L('Charges fixes', c.fixe)}
          ${L('Moins les aides', c.aides, '−')}
          <div class="line total"><span><span class="op">=</span>Reste à payer à deux</span><span>${eur(c.total)}</span></div>
          ${L(`Part ${de(N.a)} (${pct(c.pa)})`, c.partA)}
          ${L(`Déjà prélevé chez ${esc(N.a)}, aides déduites`, c.paidA)}
          ${L(`Part ${de(N.b)} (${pct(c.pb)})`, c.partB)}
          ${L(`Déjà prélevé chez ${esc(N.b)}, aides déduites`, c.paidB)}
        </div>
      </div>
      <div>
        <h3>Qui paie combien</h3>
        <div class="lines num">
          <div class="line"><span>${esc(N.a)} gagne ${eur(c.Ra)}, soit</span><span>${pct(c.pa)}</span></div>
          <div class="line"><span>${esc(N.b)} gagne ${eur(c.Rb)}, soit</span><span>${pct(c.pb)}</span></div>
        </div>
        <div class="bar" aria-hidden="true"><i style="width:${c.pa*100}%;background:var(--a)"></i><i style="width:${c.pb*100}%;background:var(--b)"></i></div>
      </div>
      <div class="encours">

        <p class="hint" style="margin:0">${c.enCours.total ? `${eur(c.enCours.total)} pour l’instant (${esc(N.a)} ${eur(c.enCours.paidA)}, ${esc(N.b)} ${eur(c.enCours.paidB)}). À ce stade, ${qui(c.enCours.diff)}. Ce sera réglé avec le virement de début ${esc(apres)}.` : `Rien pour l’instant. Les courses et les dépenses ${de(ce)} seront réglées avec le virement de début ${esc(apres)}.`}</p>

/* ---------- le suivi des mois ---------- */
let tousMois = {};   // mois/AAAA-MM -> document
const COUL = {charges:'#00875a', courses:'#b8860b', autres:'#5b6fc4'};
const LIB = {charges:'Charges, aides déduites', courses:'Courses', autres:'Autres dépenses'};
function chiffresMois(cle){
  const m = tousMois[cle] || {};
  const effM = k => Array.isArray(m[k]) ? m[k] : (main?.[k] || []);
  const D = commun(m.depenses);
  const courses = sum(D, x => /course/i.test(x.label||''));
  return {cle, charges: Math.max(0, sum(commun(effM('charges'))) - sum(effM('aides'))), courses, autres: sum(D) - courses};
}
function renderSuivi(){
  const box = $('#suivi'); if(!box || !main) return;
  const maintenant = new Date(); const fin = new Date(maintenant.getFullYear(), maintenant.getMonth(), 1);
  const cles = Object.keys(tousMois).sort();
  let debut = cles.length ? new Date(+cles[0].slice(0,4), +cles[0].slice(5,7)-1, 1) : fin;
  const six = new Date(fin.getFullYear(), fin.getMonth()-5, 1); if(debut < six) debut = six;
  const mois = [];
  for(let d = new Date(debut); d <= fin; d = new Date(d.getFullYear(), d.getMonth()+1, 1)) mois.push(chiffresMois(monthKey(d)));
  const court = c => new Date(+c.slice(0,4), +c.slice(5,7)-1, 1).toLocaleDateString('fr-FR',{month:'short'}).replace('.','');
  const long = c => new Date(+c.slice(0,4), +c.slice(5,7)-1, 1).toLocaleDateString('fr-FR',{month:'long', year:'numeric'});
  const tot = x => x.charges + x.courses + x.autres;
  const max = Math.max(1, ...mois.map(tot));
  const pas = max > 1500 ? 500 : max > 600 ? 200 : 100, haut = Math.ceil(max/pas)*pas;
  const W = Math.round(Math.max(280, Math.min(700, (box.clientWidth || 360) - 18))), H = 210, g = 40, bas = 24, zone = H - bas - 8;
  const larg = Math.min(64, (W - g - 10) / mois.length * 0.56), ecart = (W - g - 10) / mois.length;
  const y = v => 8 + zone - v/haut*zone;
  let svg = '';
  for(let v = 0; v <= haut; v += pas) svg += `<line x1="${g}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${g-8}" y="${y(v)+4}" class="ax" text-anchor="end">${v.toLocaleString('fr-FR')}</text>`;
  mois.forEach((x, i) => {
    const cx = g + ecart*i + ecart/2, x0 = cx - larg/2;
    let base = 0; const segs = ['charges','courses','autres'].filter(k => x[k] > 0);
    segs.forEach((k, j) => {
      const h = x[k]/haut*zone, top = y(base + x[k]), gap = j < segs.length-1 ? 2 : 0;
      const dernier = j === segs.length-1, r = dernier ? Math.min(4, h) : 0;
      const hh = Math.max(0, h - (j > 0 ? 2 : 0));
      svg += dernier
        ? `<path d="M${x0},${top+hh} V${top+r} Q${x0},${top} ${x0+r},${top} H${x0+larg-r} Q${x0+larg},${top} ${x0+larg},${top+r} V${top+hh} Z" fill="${COUL[k]}"/>`
        : `<rect x="${x0}" y="${top}" width="${larg}" height="${hh}" fill="${COUL[k]}"/>`;
      base += x[k];
    });
    svg += `<text x="${cx}" y="${H-6}" class="ax${i===mois.length-1?' now':''}" text-anchor="middle">${court(x.cle)}</text>`;
    svg += `<rect x="${cx-ecart/2}" y="0" width="${ecart}" height="${H-bas}" fill="transparent" class="hit" data-i="${i}" tabindex="0" aria-label="${long(x.cle)} : ${eur(tot(x))}"/>`;
  });
  const cur_ = mois[mois.length-1], av = mois[mois.length-2];
  let phrase = `Ce mois-ci, ${eur(cur_.courses)} de courses pour l’instant.`;
  if(av && av.courses > 0){ phrase += ` Le mois dernier : ${eur(av.courses)}.`; }
  const moy = mois.length > 1 ? mois.slice(0,-1).reduce((s,x)=>s+x.courses,0)/(mois.length-1) : 0;
  if(mois.length > 2 && moy > 0) phrase += ` En moyenne ${eur(moy)} par mois.`;
  box.innerHTML = `
    <div class="sec-head"><h2>Le suivi</h2></div>
    <p class="hint">${phrase}</p>
    <div class="legende">${['charges','courses','autres'].map(k=>`<span><i style="background:${COUL[k]}"></i>${LIB[k]}</span>`).join('')}</div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dépenses communes par mois">${svg}</svg><div class="tip" id="tip" hidden></div></div>
    <details class="bloc"><summary><span>Voir en tableau</span></summary>
      <div class="tab-wrap"><table><thead><tr><th>Mois</th><th>Charges</th><th>Courses</th><th>Autres</th><th>Total</th></tr></thead>
      <tbody>${mois.slice().reverse().map(x=>`<tr><td>${long(x.cle)}</td><td>${eur(x.charges)}</td><td>${eur(x.courses)}</td><td>${eur(x.autres)}</td><td><b>${eur(tot(x))}</b></td></tr>`).join('')}</tbody></table></div>
    </details>`;
  const tip = $('#tip'), chart = box.querySelector('.chart');
  const montrer = el => {
    const x = mois[+el.dataset.i];
    tip.innerHTML = `<b>${long(x.cle)}</b>${['charges','courses','autres'].map(k=>`<div><i style="background:${COUL[k]}"></i>${LIB[k]}<span>${eur(x[k])}</span></div>`).join('')}<div class="t"><span>Total</span><span>${eur(tot(x))}</span></div>`;
    tip.hidden = false;
    const r = el.getBoundingClientRect(), c = chart.getBoundingClientRect();
    let left = r.left - c.left + r.width/2 - tip.offsetWidth/2;
    left = Math.max(0, Math.min(left, c.width - tip.offsetWidth));
    tip.style.left = left + 'px'; tip.style.top = '0px';
    box.querySelectorAll('.hit').forEach(h => h.classList.toggle('on', h === el));
  };
  box.querySelectorAll('.hit').forEach(h => { h.addEventListener('mouseenter', () => montrer(h)); h.addEventListener('focus', () => montrer(h)); h.addEventListener('click', () => montrer(h)); });
  chart.addEventListener('mouseleave', () => { tip.hidden = true; });
}

let largeurSuivi = 0;
window.addEventListener('resize', () => { const b = document.querySelector('#suivi'); if(b && Math.abs(b.clientWidth - largeurSuivi) > 20){ largeurSuivi = b.clientWidth; renderSuivi(); } });
/* ---------- petite fête quand le virement est fait ---------- */
function confetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'); cv.id='confetti'; document.body.appendChild(cv);
  const dpr = window.devicePixelRatio||1, W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; const ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--green','--mustard','--green-2'].map(k=>cs.getPropertyValue(k).trim()||'#ff4f8b');
  const P = Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*120,y:H*0.28,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,
    s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function frame(t){
    const k = (t-t0)/1800; ctx.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy+=.28; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.globalAlpha=Math.max(0,1-k); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(k<1) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

/* ---------- sauvegarde ---------- */
function flash(msg){ statusEl.textContent = msg; }
function writeErr(e){
  if(e && (e.code==='permission-denied'||e.code==='invalid_argument')){ canWrite=false; flash("Ce compte n'a pas le droit de modifier le budget."); renderAll(); }
  else flash("L'enregistrement a échoué. Vérifie ta connexion, la modification sera retentée au prochain changement.");
}
const inflight = {main:false, month:false}, again = {main:false, month:false};
async function doSave(kind){
  if(!db) return;
  if(inflight[kind]){ again[kind]=true; return; }
  inflight[kind]=true; flash('Enregistrement en cours');
  try{
    if(kind==='main') await db.doc('budget/main').set(JSON.parse(JSON.stringify(main)));
    else await db.doc('mois/'+monthKey(cur)).set(JSON.parse(JSON.stringify(month)));
    flash('Enregistré');
  }catch(e){ writeErr(e); }
  inflight[kind]=false;
  if(again[kind]){ again[kind]=false; doSave(kind); }
}
function schedule(kind, now){ clearTimeout(timers[kind]); if(now) doSave(kind); else timers[kind]=setTimeout(()=>doSave(kind), 700); }
const saveMain = now => schedule('main', now), saveMonth = now => schedule('month', now);

/* ---------- interactions ---------- */
function listFor(coll){ if(coll==='depenses') return month.depenses; ensureOwn(coll); return month[coll]; }
let tagsStale = false;
app.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.name){ main.personnes = main.personnes||{}; main.personnes[t.dataset.name] = t.value; saveMain(); return; }
  const row = t.closest('.row'); if(!row) return;
  const item = listFor(row.dataset.c).find(x=>x.id===row.dataset.id); if(!item) return;
  if(t.dataset.f==='montant') item.montant = num(t.value); else item[t.dataset.f] = t.value;
  if(row.dataset.c!=='depenses') tagsStale = true;
  renderSummary(); saveMonth();
});
app.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.name){ renderAll(); return; }
  if(t.tagName==='SELECT'){
    const row = t.closest('.row'); const item = listFor(row.dataset.c).find(x=>x.id===row.dataset.id);
    item[t.dataset.f] = t.value; saveMonth(true); renderAll();
  } else if(tagsStale){ tagsStale=false; renderAll(); }
});
app.addEventListener('click', e=>{
  const add = e.target.closest('[data-add]');
  if(add){
    const coll = add.dataset.add, field = coll==='depenses'?'payeur':coll==='revenus'?'qui':'compte';
    const it = {id:uid(), label:'', montant:0}; it[field]='a';
    listFor(coll).push(it); saveMonth(true);
    renderAll();
    const rows = document.querySelectorAll(`.row[data-c="${coll}"] .l`); if(rows.length) rows[rows.length-1].focus();
    return;
  }
  const kind = e.target.closest('[data-perso]');
  if(kind){
    const row = kind.closest('.row'), coll = row.dataset.c;
    const item = listFor(coll).find(x=>x.id===row.dataset.id); if(!item) return;
    item.perso = !item.perso; saveMonth(true); renderAll(); return;
  }
  const del = e.target.closest('[data-del]');
  if(del){
    const row = del.closest('.row'), coll = row.dataset.c;
    if(coll==='depenses') month.depenses = month.depenses.filter(x=>x.id!==row.dataset.id);
    else { ensureOwn(coll); month[coll] = month[coll].filter(x=>x.id!==row.dataset.id); }
    saveMonth(true); renderAll(); return;
  }
  const tpl = e.target.closest('[data-tpl]');
  if(tpl){ const coll = tpl.dataset.tpl; main[coll] = clone(month[coll]); saveMain(true); renderAll(); flash('C\'est noté pour les prochains mois.'); return; }
  const rev = e.target.closest('[data-revert]');
  if(rev){ delete month[rev.dataset.revert]; saveMonth(true); renderAll(); }
});
// Les mises à jour venant de l'autre personne attendent que tu aies fini de taper
app.addEventListener('focusout', ()=>setTimeout(()=>{
  if(app.contains(document.activeElement) && document.activeElement.matches('input,select')) return;
  let dirty=false;
  if(pendingRemoteMain){ main=pendingRemoteMain; pendingRemoteMain=null; dirty=true; }
  if(pendingRemoteMonth){ month=pendingRemoteMonth; pendingRemoteMonth=null; dirty=true; }
  if(dirty) renderAll();
},0));
const editing = () => app.contains(document.activeElement) && document.activeElement.matches('input,select');

/* ---------- données ---------- */
function normMonth(d){
  const m = {depenses: Array.isArray(d?.depenses)?clone(d.depenses):[], vire: !!d?.vire};
  FIXED.forEach(k=>{ if(Array.isArray(d?.[k])) m[k] = clone(d[k]); });
  return m;
}
function subMonth(){
  if(unsubMonth) unsubMonth();
  if(unsubPrev) unsubPrev();
  prev = {depenses:[], vire:false};
  unsubPrev = db.doc('mois/'+monthKey(new Date(cur.getFullYear(), cur.getMonth()-1, 1))).onSnapshot(s=>{
    prev = normMonth(s.exists ? s.data() : null);
    if(!editing()) renderSummary();
  }, ()=>{});
  month = {depenses:[], vire:false}; pendingRemoteMonth=null;
  unsubMonth = db.doc('mois/'+monthKey(cur)).onSnapshot(s=>{
    if(s.metadata.hasPendingWrites) return;
    const m = normMonth(s.exists ? s.data() : null);
    if(editing()) pendingRemoteMonth = m; else { month = m; renderAll(); }
  }, ()=>flash("La synchronisation s'est interrompue. Recharge la page."));
}
function go(delta){
  if(timers.month){ clearTimeout(timers.month); doSave('month'); }
  cur = new Date(cur.getFullYear(), cur.getMonth()+delta, 1); setMonthLabel();
  if(db) subMonth(); renderAll();
}
$('#prev').onclick = ()=>go(-1); $('#next').onclick = ()=>go(1);

(async()=>{
  const auth = firebase.auth();
  const fs = firebase.firestore();
  try { await fs.enablePersistence({synchronizeTabs:true}); } catch(e) {}
  auth.getRedirectResult().catch(()=>{});
  db = { doc: p => { const r = fs.doc(p); return {
    set: d => r.set(d),
    onSnapshot: (n, e) => r.onSnapshot({includeMetadataChanges:false}, s => n({exists:s.exists, data:()=>s.data(), metadata:{hasPendingWrites:s.metadata.hasPendingWrites, fromCache:s.metadata.fromCache}}), e)
  }; } };
  const loginBox = () => {
    app.innerHTML = `<div class="notice"><h2>Connexion</h2>
      <p class="muted" style="margin:0">Connecte toi avec ton compte Google pour voir le budget.</p>
      <button class="primary" id="login">Se connecter avec Google</button></div>`;
    $('#login').onclick = () => {
      const p = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(p).catch(err => {
        if(err && (err.code==='auth/popup-blocked' || err.code==='auth/operation-not-supported-in-this-environment')) return auth.signInWithRedirect(p);
        if(err && err.code==='auth/popup-closed-by-user') return;
        flash("La connexion n'a pas marché, réessaie.");
      });
    };
  };
  let started = false;
  auth.onAuthStateChanged(u => {
    if(!u){ loginBox(); $('#logout').hidden = true; return; }
    $('#logout').hidden = false;
    if(started) return; started = true;
    fs.collection('mois').onSnapshot(snap => {
      tousMois = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
      if(!editing()) renderSuivi();
    }, () => {});
    db.doc('budget/main').onSnapshot(s=>{
      if(s.metadata.hasPendingWrites) return;
      if(!s.exists){ if(mainExists!==true){ mainExists=false; renderAll(); } return; }
      const d = JSON.parse(JSON.stringify(s.data()));
      mainExists = true;
      if(editing()) pendingRemoteMain = d; else { main = d; renderAll(); }
    }, err => { app.innerHTML = `<div class="notice"><h2>Accès refusé</h2><p class="muted" style="margin:0">Ce compte Google n'a pas accès au budget. Connecte toi avec le bon compte.</p><button class="primary" id="out2">Changer de compte</button></div>`; $('#out2').onclick=()=>auth.signOut().then(()=>location.reload()); });
    subMonth();
  });
  $('#logout').onclick = () => auth.signOut().then(()=>location.reload());
})();
})();
